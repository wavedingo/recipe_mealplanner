# Pin the project name: the directory has been renamed before (recipe_mealplan,
# recipe_mealplanner, social_recipe_mealplanner) and each rename made a plain
# `docker compose up` create a NEW stack against the SAME external data volume.
name: recipe_mealplanner

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - recipe_mealplan_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: mealplanner
      POSTGRES_DB: mealplanner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealplanner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  recipe_mealplan_postgres_data:
    external: true
